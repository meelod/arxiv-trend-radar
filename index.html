<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="arxiv·radar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preload" as="fetch" crossorigin="anonymous" href="/data/briefings/latest.json" />
    <link rel="prefetch" as="fetch" crossorigin="anonymous" href="/data/trends/latest.json" />
    <title>arxiv-trend-radar</title>
    <style>
      /* Critical CSS — applies before Tailwind loads to prevent a flash of
         unstyled content (white background, system-font text, invisible
         skeleton blocks). */
      :root { color-scheme: light; background: #fafaf9; }
      :root.dark { color-scheme: dark; background: #0c0a09; }
      html, body { margin: 0; padding: 0; }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      @keyframes _pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .animate-pulse { animation: _pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
    <script>
      // Apply theme before React mounts to avoid a flash of light-mode.
      (function () {
        try {
          var t = localStorage.getItem('atr-theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Daily arXiv briefings + weekly trend & gap analysis. Surfaces research-industry mismatches and potential startup ideas from machine learning, robotics, hardware, and quant-finance papers." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="arxiv-trend-radar" />
    <meta property="og:description" content="Daily arXiv briefings + weekly trend & gap analysis. Surfaces research-industry mismatches and potential startup ideas." />
    <meta property="og:url" content="https://arxiv-trend-radar.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="arxiv-trend-radar" />
    <meta name="twitter:description" content="Daily arXiv briefings + weekly trend & gap analysis." />
  </head>
  <body class="bg-paper dark:bg-ink text-stone-900 dark:text-stone-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
