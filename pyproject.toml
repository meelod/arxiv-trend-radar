[project]
name = "arxiv-trend-radar"
version = "0.1.0"
description = "Daily arXiv briefing + weekly trend & gap analysis"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tqdm>=4.67",
    "openai>=1.50",
    "langchain>=0.3.20",
    "langchain-openai>=0.3.9",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[tool.setuptools]
packages = ["pipeline"]
