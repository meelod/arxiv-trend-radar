name: backfill

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date YYYY-MM-DD (inclusive)"
        required: true
      until_date:
        description: "End date YYYY-MM-DD (exclusive)"
        required: true
      run_brief:
        description: "Generate briefings for backfilled days (slow + costly)"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Validate inputs
        env:
          FROM_DATE: ${{ github.event.inputs.from_date }}
          UNTIL_DATE: ${{ github.event.inputs.until_date }}
        run: |
          if ! echo "$FROM_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "invalid from_date: $FROM_DATE"; exit 1
          fi
          if ! echo "$UNTIL_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "invalid until_date: $UNTIL_DATE"; exit 1
          fi

      - name: Fetch papers
        env:
          CATEGORIES: ${{ vars.CATEGORIES }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          UNTIL_DATE: ${{ github.event.inputs.until_date }}
        run: |
          source .venv/bin/activate
          python pipeline/fetch.py --from "$FROM_DATE" --until "$UNTIL_DATE"

      - name: Embed all backfilled days
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAW_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          source .venv/bin/activate
          if [ -n "$RAW_OPENAI_BASE_URL" ]; then
            export OPENAI_BASE_URL="$RAW_OPENAI_BASE_URL"
          else
            unset OPENAI_BASE_URL
          fi
          for f in data/papers/*.jsonl; do
            [ -f "$f" ] || continue
            python pipeline/embed.py --data "$f"
          done

      - name: Generate briefings (optional)
        if: ${{ github.event.inputs.run_brief == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAW_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          INTERESTS: ${{ vars.INTERESTS }}
          FROM_DATE: ${{ github.event.inputs.from_date }}
          UNTIL_DATE: ${{ github.event.inputs.until_date }}
        run: |
          source .venv/bin/activate
          if [ -n "$RAW_OPENAI_BASE_URL" ]; then
            export OPENAI_BASE_URL="$RAW_OPENAI_BASE_URL"
          else
            unset OPENAI_BASE_URL
          fi
          d="$FROM_DATE"
          while [ "$d" != "$UNTIL_DATE" ]; do
            f="data/papers/${d}.jsonl"
            if [ -f "$f" ]; then
              python pipeline/daily_brief.py --data "$f" || echo "briefing failed for $d, continuing"
            fi
            d=$(date -u -d "$d + 1 day" +%F)
          done

      - name: Commit and push
        env:
          GIT_EMAIL: ${{ vars.EMAIL }}
          GIT_NAME: ${{ vars.NAME }}
          MSG: "backfill ${{ github.event.inputs.from_date }} to ${{ github.event.inputs.until_date }}"
        run: |
          git config user.email "$GIT_EMAIL"
          git config user.name "$GIT_NAME"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "$MSG"
            for i in 1 2 3; do
              if git push origin main; then break; fi
              git pull origin main --rebase --autostash || true
              if [ $i -eq 3 ]; then exit 1; fi
            done
          fi
