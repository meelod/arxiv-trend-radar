# GitHub auto-generated release notes config.
# Used when you click "Generate release notes" on the GitHub UI for a release.
# (The release.yml workflow uses its own logic; this is the fallback for manual releases.)

changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions
  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📝 Docs
      labels:
        - documentation
    - title: 🔧 Chores
      labels:
        - chore
        - dependencies
    - title: Other
      labels:
        - "*"
